name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or existing version tag to build
        default: main
        required: true
        type: string
      publish:
        description: Publish downloads (requires a stable version tag)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run audit:security
      - run: npm run build:release
        env:
          RELEASE_TAG: ${{ startsWith(env.BUILD_REF, 'v') && env.BUILD_REF || '' }}
      - run: npm run smoke:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myab-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: myab-*
          merge-multiple: true
          path: dist
      - name: Publish verified downloads
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*
            # Release Please creates a draft; publish only after every build passed.
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "MyAberdeen CLI $RELEASE_TAG" --generate-notes
          fi
